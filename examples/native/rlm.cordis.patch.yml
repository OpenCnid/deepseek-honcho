# DeepSeek RLM 0.1.0-preview.0 contract example at revision 79b6b28e16c7305e8e791f2d8c9d2935e75ade60.
# The surrounding RLM bundle owns these rows. Its approved optional-ToolRuntime lookup patch is required.
# Empty environment inheritance is the credential boundary: never add HONCHO_API_KEY.
- insert:
    - id: rlm-jupyter
      name: '@deepseek-rlm/dsh-rlm-jupyter'
      config:
        artifactRoot: D:/replace/with/private/rlm-artifacts
        managedRuntimeRoot: D:/replace/with/private/rlm-runtime
        subagentProvider: rlm-spawn
        envAllowlist: []
        env: {}
        adapters:
          tools: true

    - id: rlm-ipython-tool
      name: '@deepseek-rlm/dsh-tool-ipython'
